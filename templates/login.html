<!DOCTYPE html>
<html>
<head>
    <title>Admin Login - Student Marks Analysis</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-bg d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow text-center" style="width: 400px; background: rgba(255, 255, 255, 0.9);">

        <!-- Centered College Logo -->
        <div class="text-center mb-2">
            <img src="{{ url_for('static', filename='logo.png') }}" 
                 alt="College Logo" 
                 style="width: 100px; height: 100px; object-fit: contain; display: block; margin: 0 auto 10px auto;">
        </div>

        <h3 class="mb-3">🔐 Admin Login</h3>

        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST">
            <div class="mb-3 text-start">
                <label>Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>

            <div class="mb-3 text-start">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
    </div>
</body>
</html>
